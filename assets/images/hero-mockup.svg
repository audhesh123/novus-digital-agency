<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Web Browser Window -->
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="520" height="360" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="30" y="30" width="520" height="42" rx="16" fill="#131d33"/>
    <rect x="30" y="56" width="520" height="16" fill="#131d33"/>
    <line x1="30" y1="72" x2="550" y2="72" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="56" cy="51" r="5" fill="#ef4444"/>
    <circle cx="72" cy="51" r="5" fill="#f59e0b"/>
    <circle cx="88" cy="51" r="5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="120" y="42" width="280" height="20" rx="5" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="132" cy="52" r="3" fill="#38bdf8"/>
    <text x="144" y="55" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">https://novusdigital.dev/live-preview</text>

    <!-- Sidebar in Window -->
    <rect x="30" y="72" width="90" height="318" fill="rgba(10,15,29,0.5)"/>
    <rect x="44" y="90" width="62" height="10" rx="3" fill="#38bdf8" opacity="0.8"/>
    <rect x="44" y="115" width="48" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="44" y="132" width="54" height="6" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="44" y="149" width="40" height="6" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="44" y="166" width="50" height="6" rx="2" fill="rgba(255,255,255,0.15)"/>

    <!-- Content Area -->
    <!-- Metrics Row -->
    <rect x="135" y="90" width="118" height="58" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <text x="147" y="106" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8" font-weight="600">PAGE SPEED SCORE</text>
    <text x="147" y="134" font-family="-apple-system, sans-serif" font-size="18" fill="#10b981" font-weight="800">99 / 100</text>

    <rect x="265" y="90" width="118" height="58" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <text x="277" y="106" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8" font-weight="600">CONVERSION RATE</text>
    <text x="277" y="134" font-family="-apple-system, sans-serif" font-size="18" fill="#38bdf8" font-weight="800">+142%</text>

    <rect x="395" y="90" width="135" height="58" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <text x="407" y="106" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8" font-weight="600">MOBILE OPTIMIZED</text>
    <text x="407" y="134" font-family="-apple-system, sans-serif" font-size="18" fill="#a855f7" font-weight="800">100% PASS</text>

    <!-- Chart Panel -->
    <rect x="135" y="160" width="395" height="210" rx="10" fill="rgba(10,15,29,0.7)" stroke="rgba(255,255,255,0.06)"/>
    <text x="150" y="182" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff" font-weight="700">Digital Experience Metrics</text>
    <text x="150" y="196" font-family="-apple-system, sans-serif" font-size="8" fill="#64748b">Real-time performance tracking &amp; SEO health</text>

    <!-- Bar Chart -->
    <rect x="160" y="300" width="22" height="50" rx="4" fill="url(#barGrad)"/>
    <rect x="200" y="270" width="22" height="80" rx="4" fill="url(#barGrad)"/>
    <rect x="240" y="250" width="22" height="100" rx="4" fill="url(#barGrad)"/>
    <rect x="280" y="230" width="22" height="120" rx="4" fill="url(#barGrad)"/>
    <rect x="320" y="215" width="22" height="135" rx="4" fill="url(#accentGrad)"/>
    <rect x="360" y="240" width="22" height="110" rx="4" fill="url(#barGrad)"/>
    <rect x="400" y="225" width="22" height="125" rx="4" fill="url(#barGrad)"/>
    <rect x="440" y="210" width="22" height="140" rx="4" fill="url(#accentGrad)"/>
    <rect x="480" y="200" width="22" height="150" rx="4" fill="url(#accentGrad)"/>
    
    <line x1="150" y1="350" x2="515" y2="350" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>

  <!-- Mobile Phone Mockup Overlay -->
  <g filter="url(#shadow)">
    <rect x="480" y="160" width="180" height="310" rx="28" fill="url(#phoneGrad)" stroke="rgba(56,189,248,0.4)" stroke-width="2.5"/>
    <rect x="490" y="170" width="160" height="290" rx="20" fill="#0b1120"/>
    
    <!-- Phone Notch -->
    <rect x="540" y="176" width="60" height="8" rx="4" fill="#1e293b"/>
    
    <!-- App UI Inside Phone -->
    <circle cx="515" cy="206" r="12" fill="url(#accentGrad)"/>
    <rect x="535" y="200" width="80" height="7" rx="3" fill="#ffffff"/>
    <rect x="535" y="211" width="50" height="5" rx="2" fill="#64748b"/>
    
    <!-- Card inside mobile -->
    <rect x="500" y="230" width="140" height="65" rx="10" fill="rgba(37,99,235,0.15)" stroke="rgba(56,189,248,0.3)"/>
    <text x="510" y="248" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8" font-weight="700">App Development</text>
    <text x="510" y="262" font-family="-apple-system, sans-serif" font-size="8" fill="#cbd5e1">iOS &amp; Android Ready</text>
    <rect x="510" y="272" width="60" height="14" rx="4" fill="#2563eb"/>
    <text x="518" y="282" font-family="-apple-system, sans-serif" font-size="7" fill="#ffffff" font-weight="700">View Demo</text>

    <!-- List inside mobile -->
    <rect x="500" y="305" width="140" height="35" rx="8" fill="rgba(255,255,255,0.04)"/>
    <circle cx="515" cy="322" r="7" fill="#10b981"/>
    <rect x="528" y="318" width="65" height="5" rx="2" fill="#e2e8f0"/>
    <rect x="528" y="326" width="40" height="4" rx="2" fill="#64748b"/>

    <rect x="500" y="348" width="140" height="35" rx="8" fill="rgba(255,255,255,0.04)"/>
    <circle cx="515" cy="365" r="7" fill="#6366f1"/>
    <rect x="528" y="361" width="70" height="5" rx="2" fill="#e2e8f0"/>
    <rect x="528" y="369" width="45" height="4" rx="2" fill="#64748b"/>

    <!-- Bottom Nav on Phone -->
    <rect x="500" y="425" width="140" height="25" rx="6" fill="#131d33"/>
    <circle cx="525" cy="437" r="4" fill="#38bdf8"/>
    <circle cx="570" cy="437" r="4" fill="#64748b"/>
    <circle cx="615" cy="437" r="4" fill="#64748b"/>
  </g>

  <!-- Interactive Tag / Floating Badge -->
  <g filter="url(#shadow)">
    <rect x="20" y="370" width="190" height="60" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="48" cy="400" r="16" fill="#10b981" opacity="0.15"/>
    <circle cx="48" cy="400" r="7" fill="#10b981"/>
    <text x="72" y="394" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff" font-weight="700">100% Quality Guaranteed</text>
    <text x="72" y="408" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Affordable agency pricing</text>
  </g>
</svg>
