<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <rect width="600" height="380" fill="#0c1322"/>
  <!-- Top bar -->
  <rect width="600" height="34" fill="#141e33"/>
  <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
  <circle cx="35" cy="17" r="4.5" fill="#f59e0b"/>
  <circle cx="50" cy="17" r="4.5" fill="#10b981"/>
  <rect x="75" y="8" width="220" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="88" y="20" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">https://cloudmetric.io/app</text>

  <!-- Sidebar -->
  <rect x="0" y="34" width="70" height="346" fill="#090e1a"/>
  <circle cx="35" cy="65" r="14" fill="#2563eb"/>
  <circle cx="35" cy="115" r="10" fill="rgba(255,255,255,0.2)"/>
  <circle cx="35" cy="155" r="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="35" cy="195" r="10" fill="rgba(255,255,255,0.1)"/>

  <!-- Main Body -->
  <g transform="translate(95, 55)">
    <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" font-weight="800">Telemetry &amp; Cluster Health</text>
    <rect x="365" y="5" width="100" height="26" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="380" y="22" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">Live Streaming</text>

    <!-- Cards -->
    <rect x="0" y="45" width="145" height="75" rx="8" fill="#141f36"/>
    <text x="14" y="66" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8">CPU UTILIZATION</text>
    <text x="14" y="98" font-family="-apple-system, sans-serif" font-size="20" fill="#38bdf8" font-weight="800">34.8%</text>

    <rect x="160" y="45" width="145" height="75" rx="8" fill="#141f36"/>
    <text x="174" y="66" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8">LATENCY P99</text>
    <text x="174" y="98" font-family="-apple-system, sans-serif" font-size="20" fill="#10b981" font-weight="800">18 ms</text>

    <rect x="320" y="45" width="145" height="75" rx="8" fill="#141f36"/>
    <text x="334" y="66" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8">UPTIME (30D)</text>
    <text x="334" y="98" font-family="-apple-system, sans-serif" font-size="20" fill="#a855f7" font-weight="800">99.99%</text>

    <!-- Chart -->
    <rect x="0" y="135" width="465" height="165" rx="10" fill="#141f36" stroke="rgba(255,255,255,0.06)"/>
    <path d="M 20 250 L 80 230 L 140 210 L 200 240 L 260 180 L 320 190 L 380 160 L 440 170" fill="none" stroke="#6366f1" stroke-width="3"/>
    <path d="M 20 270 L 80 250 L 140 240 L 200 260 L 260 210 L 320 220 L 380 180 L 440 190" fill="none" stroke="#06b6d4" stroke-width="3"/>
  </g>
</svg>
