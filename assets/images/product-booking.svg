<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none">
  <rect width="500" height="320" rx="16" fill="#0f172a"/>
  <!-- Top bar -->
  <rect width="500" height="36" fill="#131d33"/>
  <circle cx="20" cy="18" r="4" fill="#ef4444"/>
  <circle cx="34" cy="18" r="4" fill="#f59e0b"/>
  <circle cx="48" cy="18" r="4" fill="#10b981"/>
  <rect x="70" y="10" width="180" height="16" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="80" y="21" font-family="-apple-system, sans-serif" font-size="8" fill="#64748b">omnibook-pro.novus.dev</text>

  <!-- Calendar Grid Layout -->
  <rect x="25" y="55" width="450" height="245" rx="12" fill="#17223b" stroke="rgba(255,255,255,0.08)"/>
  <text x="45" y="85" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="700">Online Appointment Scheduler</text>
  <rect x="360" y="70" width="95" height="24" rx="6" fill="#2563eb"/>
  <text x="375" y="86" font-family="-apple-system, sans-serif" font-size="9" fill="#ffffff" font-weight="700">+ New Booking</text>

  <!-- Calendar days -->
  <g transform="translate(45, 110)">
    <!-- Mon -->
    <rect x="0" y="0" width="75" height="170" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
    <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">Mon 14</text>
    <rect x="8" y="38" width="59" height="34" rx="4" fill="#1e3a8a"/>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="7" fill="#60a5fa" font-weight="700">09:00 AM</text>
    <text x="14" y="64" font-family="-apple-system, sans-serif" font-size="7" fill="#ffffff">Design Audit</text>

    <!-- Tue -->
    <rect x="85" y="0" width="75" height="170" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
    <text x="97" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">Tue 15</text>
    <rect x="93" y="60" width="59" height="34" rx="4" fill="#4c1d95"/>
    <text x="99" y="74" font-family="-apple-system, sans-serif" font-size="7" fill="#c084fc" font-weight="700">11:30 AM</text>
    <text x="99" y="86" font-family="-apple-system, sans-serif" font-size="7" fill="#ffffff">Client Kickoff</text>

    <!-- Wed (Active) -->
    <rect x="170" y="0" width="75" height="170" rx="8" fill="rgba(37,99,235,0.12)" stroke="rgba(56,189,248,0.4)"/>
    <text x="182" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" font-weight="700">Wed 16</text>
    <rect x="178" y="40" width="59" height="34" rx="4" fill="#065f46"/>
    <text x="184" y="54" font-family="-apple-system, sans-serif" font-size="7" fill="#34d399" font-weight="700">10:00 AM</text>
    <text x="184" y="66" font-family="-apple-system, sans-serif" font-size="7" fill="#ffffff">App Review</text>
    <rect x="178" y="85" width="59" height="34" rx="4" fill="#1e3a8a"/>
    <text x="184" y="99" font-family="-apple-system, sans-serif" font-size="7" fill="#60a5fa" font-weight="700">02:00 PM</text>
    <text x="184" y="111" font-family="-apple-system, sans-serif" font-size="7" fill="#ffffff">Sprint Demo</text>

    <!-- Thu -->
    <rect x="255" y="0" width="75" height="170" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
    <text x="267" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">Thu 17</text>
    <rect x="263" y="90" width="59" height="34" rx="4" fill="#1e3a8a"/>
    <text x="269" y="104" font-family="-apple-system, sans-serif" font-size="7" fill="#60a5fa" font-weight="700">03:30 PM</text>
    <text x="269" y="116" font-family="-apple-system, sans-serif" font-size="7" fill="#ffffff">Web Strategy</text>

    <!-- Fri -->
    <rect x="340" y="0" width="75" height="170" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
    <text x="352" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">Fri 18</text>
    <rect x="348" y="45" width="59" height="34" rx="4" fill="#4c1d95"/>
    <text x="354" y="59" font-family="-apple-system, sans-serif" font-size="7" fill="#c084fc" font-weight="700">01:00 PM</text>
    <text x="354" y="71" font-family="-apple-system, sans-serif" font-size="7" fill="#ffffff">Final Handover</text>
