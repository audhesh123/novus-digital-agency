<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <rect width="600" height="380" fill="#0c1322"/>
  <!-- Browser top -->
  <rect width="600" height="34" fill="#141e33"/>
  <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
  <circle cx="35" cy="17" r="4.5" fill="#f59e0b"/>
  <circle cx="50" cy="17" r="4.5" fill="#10b981"/>
  <rect x="75" y="8" width="220" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="88" y="20" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">https://flowsync.io</text>

  <!-- High Converting Landing Page Mockup -->
  <rect x="0" y="34" width="600" height="230" fill="linear-gradient(180deg, #131d33 0%, #0c1322 100%)"/>
  <text x="300" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" fill="#ffffff" font-weight="800">Automate Team Workflows in Minutes</text>
  <text x="300" y="112" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Connect apps, eliminate manual repetitive tasks, and scale faster.</text>

  <!-- CTA buttons in mockup -->
  <rect x="200" y="130" width="105" height="30" rx="6" fill="#2563eb"/>
  <text x="218" y="149" font-family="-apple-system, sans-serif" font-size="9" fill="#ffffff" font-weight="700">Start Free Trial</text>
  <rect x="315" y="130" width="85" height="30" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="333" y="149" font-family="-apple-system, sans-serif" font-size="9" fill="#ffffff" font-weight="600">Watch Video</text>

  <!-- Workflow nodes preview -->
  <rect x="80" y="180" width="440" height="160" rx="12" fill="#17223b" stroke="rgba(56,189,248,0.2)"/>
  <g transform="translate(110, 220)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="85" height="45" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="10" y="26" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700">New Webhook</text>

    <!-- Connector -->
    <line x1="85" y1="22" x2="135" y2="22" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="2"/>

    <!-- Node 2 -->
    <rect x="135" y="0" width="95" height="45" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="145" y="26" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700">Filter Data</text>

    <!-- Connector -->
    <line x1="230" y1="22" x2="280" y2="22" stroke="#10b981" stroke-dasharray="3,3" stroke-width="2"/>

    <!-- Node 3 -->
    <rect x="280" y="0" width="100" height="45" rx="6" fill="#1e293b" stroke="#a855f7"/>
    <text x="290" y="26" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700">Sync Database</text>
  </g>
</svg>
