<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <rect width="600" height="380" fill="#0c1322"/>
  <!-- Centered Mobile Devices Mockup -->
  <g transform="translate(140, 20)">
    <!-- Device 1: Left Background Phone -->
    <rect x="0" y="40" width="150" height="300" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="3" opacity="0.6"/>
    <rect x="10" y="50" width="130" height="280" rx="18" fill="#131d33"/>

    <!-- Device 2: Main Active Phone (Front) -->
    <rect x="100" y="10" width="180" height="350" rx="28" fill="#070b14" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="110" y="20" width="160" height="330" rx="20" fill="#0b1120"/>
    
    <!-- Notch -->
    <rect x="155" y="26" width="70" height="10" rx="5" fill="#1e293b"/>

    <!-- Balance Card -->
    <rect x="120" y="55" width="140" height="80" rx="12" fill="linear-gradient(135deg, #2563eb 0%, #6366f1 100%)"/>
    <text x="132" y="74" font-family="-apple-system, sans-serif" font-size="8" fill="#e0e7ff">Total Balance</text>
    <text x="132" y="98" font-family="-apple-system, sans-serif" font-size="18" fill="#ffffff" font-weight="800">$42,910.50</text>
    <text x="132" y="122" font-family="-apple-system, sans-serif" font-size="7" fill="#a5b4fc">**** 9042 | Visa Platinum</text>

    <!-- Quick Action Icons -->
    <circle cx="138" cy="160" r="14" fill="#1e293b"/>
    <text x="133" y="164" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">↑</text>
    <circle cx="178" cy="160" r="14" fill="#1e293b"/>
    <text x="174" y="164" font-family="-apple-system, sans-serif" font-size="9" fill="#10b981">↓</text>
    <circle cx="218" cy="160" r="14" fill="#1e293b"/>
    <text x="214" y="164" font-family="-apple-system, sans-serif" font-size="9" fill="#f59e0b">★</text>

    <!-- Transactions List -->
    <rect x="120" y="190" width="140" height="42" rx="8" fill="#131d33"/>
    <circle cx="135" cy="211" r="9" fill="#2563eb"/>
    <text x="150" y="208" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="600">Apple Store</text>
    <text x="150" y="218" font-family="-apple-system, sans-serif" font-size="7" fill="#64748b">Electronic • Today</text>
    <text x="225" y="212" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700">-$1,199</text>

    <rect x="120" y="240" width="140" height="42" rx="8" fill="#131d33"/>
    <circle cx="135" cy="261" r="9" fill="#10b981"/>
    <text x="150" y="258" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="600">Salary Deposit</text>
    <text x="150" y="268" font-family="-apple-system, sans-serif" font-size="7" fill="#64748b">Direct Transfer</text>
    <text x="223" y="262" font-family="-apple-system, sans-serif" font-size="8" fill="#10b981" font-weight="700">+$6,450</text>

    <!-- Bottom Nav -->
    <rect x="120" y="305" width="140" height="30" rx="8" fill="#17223b"/>
    <circle cx="145" cy="320" r="4" fill="#38bdf8"/>
    <circle cx="190" cy="320" r="4" fill="#64748b"/>
    <circle cx="235" cy="320" r="4" fill="#64748b"/>
  </g>
</svg>
