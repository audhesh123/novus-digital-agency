<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <rect width="600" height="380" fill="#0c1322"/>
  <!-- Browser top -->
  <rect width="600" height="34" fill="#141e33"/>
  <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
  <circle cx="35" cy="17" r="4.5" fill="#f59e0b"/>
  <circle cx="50" cy="17" r="4.5" fill="#10b981"/>
  <rect x="75" y="8" width="220" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="88" y="20" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">https://novumedical.org</text>

  <!-- Healthcare Portal Mockup -->
  <rect x="0" y="34" width="600" height="80" fill="#11192b"/>
  <text x="40" y="70" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" font-weight="800">NovuCare Digital Health Clinic</text>
  <text x="40" y="90" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">HIPAA-Compliant Patient Portal &amp; Telehealth Booking</text>
  <rect x="440" y="55" width="120" height="32" rx="6" fill="#059669"/>
  <text x="455" y="75" font-family="-apple-system, sans-serif" font-size="10" fill="#ffffff" font-weight="700">Book Visit</text>

  <g transform="translate(40, 130)">
    <!-- Doctor Card 1 -->
    <rect x="0" y="0" width="160" height="210" rx="10" fill="#17223b" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="80" cy="55" r="30" fill="#065f46"/>
    <circle cx="80" cy="48" r="14" fill="#34d399"/>
    <text x="80" y="110" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff" font-weight="700">Dr. Elena Rostova</text>
    <text x="80" y="126" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8">Cardiology Specialist</text>
    <rect x="25" y="150" width="110" height="26" rx="5" fill="#2563eb"/>
    <text x="80" y="167" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700">Available Today</text>

    <!-- Doctor Card 2 -->
    <rect x="180" y="0" width="160" height="210" rx="10" fill="#17223b" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="260" cy="55" r="30" fill="#1e3a8a"/>
    <circle cx="260" cy="48" r="14" fill="#60a5fa"/>
    <text x="260" y="110" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff" font-weight="700">Dr. Marcus Vance</text>
    <text x="260" y="126" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8">Neurology &amp; Wellness</text>
    <rect x="205" y="150" width="110" height="26" rx="5" fill="#2563eb"/>
    <text x="260" y="167" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700">Available Tomorrow</text>

    <!-- Telehealth Live Panel -->
    <rect x="360" y="0" width="160" height="210" rx="10" fill="linear-gradient(135deg, #1e293b 0%, #111a2f 100%)" stroke="rgba(56,189,248,0.3)"/>
    <text x="380" y="30" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" font-weight="700">Telehealth Video</text>
    <rect x="380" y="50" width="120" height="85" rx="6" fill="#0f172a"/>
    <circle cx="440" cy="85" r="16" fill="#ef4444"/>
    <text x="440" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7" fill="#cbd5e1">Secure HD Video</text>
    <rect x="380" y="150" width="120" height="26" rx="5" fill="#059669"/>
    <text x="440" y="167" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700">Join Waiting Room</text>
  </g>
</svg>
